<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Tiron</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            text-align: center;
            max-width: 360px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.6s ease-out;
            position: relative;
            z-index: 1;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin: 0 auto 24px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -1px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.04em;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.75);
            width: 100%;
        }

        .bio {
            color: #e0e0e0;
            font-size: 1rem;
            margin-bottom: 40px;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #ffffff;
            text-decoration: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.16);
            cursor: pointer;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            outline: none;
            font-family: inherit;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .link-card:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .link-card:active {
            transform: translateY(-1px);
        }

        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: #000000;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            bottom: 30px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline id="bg-video" class="video-bg">
        <source src="bg.mp4" type="video/mp4">
    </video>

    <div class="container">
        <div class="avatar">T</div>
        
        <h1>Tiron</h1>
        <p class="bio">info</p>

        <div class="links-container">
            
            <button class="link-card" onclick="copyToClipboard('4ltiron', 'tiktok user copied')">
                <i class="fab fa-tiktok"></i>4ltiron
            </button>

            <a href="https://www.instagram.com/tncellina" target="_blank" class="link-card">
                <i class="fab fa-instagram"></i>tncellina
            </a>

            <a href="https://github.com/calinaboss" target="_blank" class="link-card">
                <i class="fab fa-github"></i> calinaboss
            </a>

            <button class="link-card" onclick="copyToClipboard('tironw', 'Discord tag copied')">
                <i class="fab fa-discord"></i>tironw
            </button>

            <button class="link-card" onclick="copyToClipboard('tiron@t-works.it', 'Email copied')">
                <i class="fas fa-envelope"></i> tiron@t-works.it
            </button>
            
        </div>
    </div>

    <div id="toast" class="toast">Copied</div>

    <script>
        document.getElementById('bg-video').playbackRate = 1;

        function copyToClipboard(text, message) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.innerText = message;
                toast.classList.add('show');
                
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            }).catch(err => {
                console.error(err);
            });
        }
    </script>

</body>
</html>
